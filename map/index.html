<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Orientation Reference Host</title>
  </head>
  <body>
    <main class="shell">
      <aside class="panel">
        <p class="eyebrow">WGT SYSTEM · ORIENTATION</p>
        <h1>Discover. Explore. Navigate.</h1>
        <p>
          Reference/development host for the generic Orientation map surface.
          Domain semantics belong to the supplying bounded context.
        </p>
        <form id="place-search" class="place-search">
          <label for="place-query">Find a place</label>
          <div class="place-search-row">
            <input id="place-query" name="q" type="search" placeholder="Search for a place or address" autocomplete="off" />
            <button type="submit">Search</button>
          </div>
          <p id="place-search-status" class="place-search-status" role="status" aria-live="polite"></p>
          <ol id="place-results" class="place-results" aria-label="Place search results"></ol>
        </form>
        <div id="selection" class="selection" aria-live="polite">
          Select a spatial feature on the map.
        </div>
        <div class="reverse-lookup">
          <button id="identify-center" type="button">Identify map center</button>
          <p id="reverse-status" class="place-search-status" role="status" aria-live="polite"></p>
        </div>
        <div class="location-demo" aria-label="Current location demonstration">
          <p class="location-demo-title">Current location demo</p>
          <p id="location-status" class="location-status" aria-live="polite">No position supplied.</p>
          <div class="location-controls">
            <button id="set-location" type="button">Set sample position</button>
            <button id="update-location" type="button">Update position</button>
            <button id="clear-location" type="button">Clear position</button>
          </div>
        </div>
      </aside>
      <section id="map" class="map" aria-label="Orientation reference map">
        <p id="map-status" class="map-status" hidden role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/reference/main.ts"></script>
  </body>
</html>
