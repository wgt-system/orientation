name: Valhalla Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/valhalla-smoke.yml"
      - ".github/scripts/photon-smoke-stub.py"
      - ".github/scripts/reference-route-browser-smoke.py"
      - ".github/scripts/standalone-discovery-browser-smoke.py"
      - ".github/scripts/screenshot-color-diagnostics.py"
      - "backend/src/main/java/system/wgt/orientation/application/routing/**"
      - "backend/src/main/java/system/wgt/orientation/domain/routing/**"
      - "backend/src/main/java/system/wgt/orientation/host/routing/**"
      - "backend/src/main/java/system/wgt/orientation/infrastructure/routing/**"
      - "backend/src/main/java/system/wgt/orientation/application/discovery/**"
      - "backend/src/main/java/system/wgt/orientation/domain/discovery/**"
      - "backend/src/main/java/system/wgt/orientation/host/discovery/**"
      - "backend/src/main/java/system/wgt/orientation/infrastructure/discovery/**"
      - "backend/src/main/resources/**"
      - "contracts/examples/spatial-research-v1.valid.json"
      - "deployment/valhalla/**"
      - "map/index.html"
      - "map/app.html"
      - "map/src/app/**"
      - "map/src/lib/map-surface.ts"
      - "map/src/lib/route-overlay.ts"
      - "map/src/reference/**"
      - "map/src/styles.css"
      - "map/vite.config.ts"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/valhalla-smoke.yml"
      - ".github/scripts/photon-smoke-stub.py"
      - ".github/scripts/reference-route-browser-smoke.py"
      - ".github/scripts/standalone-discovery-browser-smoke.py"
      - ".github/scripts/screenshot-color-diagnostics.py"
      - "backend/src/main/java/system/wgt/orientation/application/routing/**"
      - "backend/src/main/java/system/wgt/orientation/domain/routing/**"
      - "backend/src/main/java/system/wgt/orientation/host/routing/**"
      - "backend/src/main/java/system/wgt/orientation/infrastructure/routing/**"
      - "backend/src/main/java/system/wgt/orientation/application/discovery/**"
      - "backend/src/main/java/system/wgt/orientation/domain/discovery/**"
      - "backend/src/main/java/system/wgt/orientation/host/discovery/**"
      - "backend/src/main/java/system/wgt/orientation/infrastructure/discovery/**"
      - "backend/src/main/resources/**"
      - "contracts/examples/spatial-research-v1.valid.json"
      - "deployment/valhalla/**"
      - "map/index.html"
      - "map/app.html"
      - "map/src/app/**"
      - "map/src/lib/map-surface.ts"
      - "map/src/lib/route-overlay.ts"
      - "map/src/reference/**"
      - "map/src/styles.css"
      - "map/vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: map/package-lock.json

      - name: Start pinned Valhalla runtime
        run: docker compose -f deployment/valhalla/docker-compose.yml up -d

      - name: Wait for Valhalla graph and service
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://localhost:8002/status > /tmp/valhalla-status.json; then
              cat /tmp/valhalla-status.json
              exit 0
            fi
            sleep 5
          done
          echo "Valhalla did not become ready within 10 minutes."
          exit 1

      - name: Start deterministic Photon smoke stub
        run: |
          python3 .github/scripts/photon-smoke-stub.py > /tmp/photon-smoke.log 2>&1 &
          echo $! > /tmp/photon-smoke.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "http://127.0.0.1:8999/api?q=health&limit=1" > /tmp/photon-health.json; then
              cat /tmp/photon-health.json
              exit 0
            fi
            sleep 1
          done
          echo "Photon smoke stub did not become ready."
          exit 1

      - name: Start Orientation backend
        run: |
          rm -f /tmp/orientation-smoke.db /tmp/orientation-standalone-collection-id
          cd backend
          ORIENTATION_DATABASE_PATH=/tmp/orientation-smoke.db \
          ORIENTATION_PHOTON_BASE_URL=http://127.0.0.1:8999 \
            ./mvnw --batch-mode spring-boot:run > /tmp/orientation.log 2>&1 &
          echo $! > /tmp/orientation.pid

      - name: Wait for Orientation health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health > /tmp/orientation-health.json; then
              cat /tmp/orientation-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Orientation did not become healthy within two minutes."
          exit 1

      - name: Route through Orientation for all supported profiles
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          endpoint = "http://localhost:8080/api/v1/routes"
          origin = {"longitude": 10.0067, "latitude": 53.5526}
          destination = {"longitude": 9.9921, "latitude": 53.5504}

          def nearby(actual, expected, tolerance=0.02):
              return (
                  abs(actual["longitude"] - expected["longitude"]) <= tolerance
                  and abs(actual["latitude"] - expected["latitude"]) <= tolerance
              )

          for profile in ("DRIVING", "CYCLING", "WALKING"):
              payload = json.dumps({
                  "origin": origin,
                  "destination": destination,
                  "profile": profile,
              }).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200, (profile, response.status)
                  body = json.load(response)

              route = body["route"]
              geometry = route["geometry"]
              assert len(geometry) >= 2, (profile, len(geometry))
              assert route["distanceMeters"] > 0, (profile, route["distanceMeters"])
              assert route["durationSeconds"] > 0, (profile, route["durationSeconds"])
              assert route["profile"] == profile, (profile, route["profile"])
              assert nearby(geometry[0], origin), (profile, "first", geometry[0], origin)
              assert nearby(geometry[-1], destination), (profile, "last", geometry[-1], destination)
              print(profile, "points=", len(geometry), "distanceMeters=", route["distanceMeters"], "durationSeconds=", route["durationSeconds"])
          PY

      - name: Build and start production Orientation browser hosts
        run: |
          cd map
          npm ci
          npm run build
          ORIENTATION_BACKEND_URL=http://127.0.0.1:8080 \
            npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reference-host.log 2>&1 &
          echo $! > /tmp/reference-host.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/reference-index.html \
              && curl --fail --silent --show-error http://127.0.0.1:4173/app.html > /tmp/orientation-app.html; then
              exit 0
            fi
            sleep 1
          done
          echo "Orientation browser preview did not become ready."
          exit 1

      - name: Start ChromeDriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 --allowed-origins='*' > /tmp/chromedriver.log 2>&1 &
          echo $! > /tmp/chromedriver.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9515/status > /tmp/chromedriver-status.json; then
              cat /tmp/chromedriver-status.json
              exit 0
            fi
            sleep 1
          done
          echo "ChromeDriver did not become ready."
          exit 1

      - name: Run real Reference Host route browser smoke
        run: python3 .github/scripts/reference-route-browser-smoke.py

      - name: Import through standalone Orientation app
        run: python3 .github/scripts/standalone-discovery-browser-smoke.py import

      - name: Restart Orientation backend with the same discovery database
        run: |
          parent="$(cat /tmp/orientation.pid)"
          pkill -TERM -P "$parent" 2>/dev/null || true
          kill "$parent" 2>/dev/null || true
          for attempt in $(seq 1 30); do
            if ! curl --silent --max-time 1 http://localhost:8080/actuator/health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Orientation backend did not stop before restart."
              exit 1
            fi
            sleep 1
          done
          cd backend
          ORIENTATION_DATABASE_PATH=/tmp/orientation-smoke.db \
          ORIENTATION_PHOTON_BASE_URL=http://127.0.0.1:8999 \
            ./mvnw --batch-mode spring-boot:run > /tmp/orientation-restart.log 2>&1 &
          echo $! > /tmp/orientation.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health > /tmp/orientation-restart-health.json; then
              cat /tmp/orientation-restart-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Orientation did not become healthy after restart."
          exit 1

      - name: Reopen persisted discovery and route through standalone app
        run: python3 .github/scripts/standalone-discovery-browser-smoke.py reopen

      - name: Screenshot color diagnostics
        if: failure()
        run: python3 .github/scripts/screenshot-color-diagnostics.py /tmp/reference-*.png

      - name: Upload browser smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orientation-browser-smoke-${{ github.sha }}
          path: /tmp/reference-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Diagnostics
        if: failure()
        run: |
          echo "=== Orientation initial ==="
          cat /tmp/orientation.log 2>/dev/null || true
          echo "=== Orientation restart ==="
          cat /tmp/orientation-restart.log 2>/dev/null || true
          echo "=== Photon stub ==="
          cat /tmp/photon-smoke.log 2>/dev/null || true
          echo "=== Browser hosts ==="
          cat /tmp/reference-host.log 2>/dev/null || true
          echo "=== ChromeDriver ==="
          cat /tmp/chromedriver.log 2>/dev/null || true
          echo "=== Valhalla ==="
          docker compose -f deployment/valhalla/docker-compose.yml logs --no-color valhalla || true

      - name: Cleanup
        if: always()
        run: |
          for pidfile in /tmp/chromedriver.pid /tmp/reference-host.pid /tmp/orientation.pid /tmp/photon-smoke.pid; do
            if [ -f "$pidfile" ]; then
              parent="$(cat "$pidfile")"
              pkill -TERM -P "$parent" 2>/dev/null || true
              kill "$parent" 2>/dev/null || true
            fi
          done
          rm -f /tmp/orientation-smoke.db /tmp/orientation-standalone-collection-id
          docker compose -f deployment/valhalla/docker-compose.yml down -v || true
