name: Create v0.5.0 Milestone

on:
  push:
    paths:
      - .github/workflows/create-v0.5.0-milestone.yml

permissions:
  issues: write

jobs:
  create:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Create milestone if absent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$REPO/milestones?state=all&per_page=100" --jq '.[] | select(.title == "v0.5.0") | .number' | head -n1)"
          if [ -n "$existing" ]; then
            echo "Milestone v0.5.0 already exists as #$existing"
            exit 0
          fi
          gh api --method POST "repos/$REPO/milestones" \
            -f title='v0.5.0' \
            -f description='Deliver the first provider-neutral public-transit Journey baseline using MOTIS behind Orientation-owned boundaries. No shared mobility or full realtime coverage claim.'
