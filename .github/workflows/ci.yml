name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test backend
        run: ./mvnw --batch-mode verify

  map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: map/package-lock.json
      - name: Install
        run: npm ci
      - name: Test and build
        run: npm run check
