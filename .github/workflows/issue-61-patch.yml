name: Patch issue 61 mobile quick navigation

on:
  push:
    branches: [issue/61-mobile-quick-navigation]
    paths: [.github/workflows/issue-61-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue/61-mobile-quick-navigation
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: map/package-lock.json
      - shell: python
        run: |
          from pathlib import Path

          app = Path('map/src/app/app.ts')
          text = app.read_text(encoding='utf-8')
          replacements = [
              (
                  '''  routeUseCurrentLocation.disabled = true;\n  setStatus(routeOriginStatus, "Requesting current location…");\n  navigator.geolocation.getCurrentPosition(\n    (position) => {\n      routeUseCurrentLocation.disabled = false;''',
                  '''  originAbort?.abort();\n  originAbort = undefined;\n  const sequence = ++originRequest;\n  routeOriginResults.replaceChildren();\n  routeUseCurrentLocation.disabled = true;\n  setStatus(routeOriginStatus, "Requesting current location…");\n  navigator.geolocation.getCurrentPosition(\n    (position) => {\n      if (sequence !== originRequest) return;\n      routeUseCurrentLocation.disabled = false;''',
              ),
              (
                  '''    (error) => {\n      routeUseCurrentLocation.disabled = false;''',
                  '''    (error) => {\n      if (sequence !== originRequest) return;\n      routeUseCurrentLocation.disabled = false;''',
              ),
              (
                  '''  const query = routeOriginQuery.value.trim();\n  if (!query) return;\n  originAbort?.abort();''',
                  '''  const query = routeOriginQuery.value.trim();\n  if (!query) return;\n  routeUseCurrentLocation.disabled = false;\n  originAbort?.abort();''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one app.ts match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          app.write_text(text, encoding='utf-8')

          smoke = Path('.github/scripts/standalone-journey-browser-smoke.py')
          text = smoke.read_text(encoding='utf-8')
          old = '''        const research=document.querySelector('#research-panel');\n        if(!research) return null;\n        const bodyOverflow=getComputedStyle(document.body).overflowY;\n        const researchOverflow=getComputedStyle(research).overflowY;\n        return (document.documentElement.scrollHeight > window.innerHeight && researchOverflow !== 'auto')\n          ? {bodyOverflow, researchOverflow, scrollHeight:document.documentElement.scrollHeight}\n          : null;'''
          new = '''        const research=document.querySelector('#research-panel');\n        const collections=document.querySelector('#collections-panel');\n        const navigate=document.querySelector('#navigate-card');\n        const nav=document.querySelector('.app-jump-nav');\n        if(!research || !collections || !navigate || !nav) return null;\n        const bodyOverflow=getComputedStyle(document.body).overflowY;\n        const researchOverflow=getComputedStyle(research).overflowY;\n        const navigateTop=navigate.getBoundingClientRect().top;\n        const navigationFirst=navigateTop < research.getBoundingClientRect().top && navigateTop < collections.getBoundingClientRect().top;\n        const firstJump=nav.querySelector('a')?.getAttribute('href');\n        return (document.documentElement.scrollHeight > window.innerHeight && researchOverflow !== 'auto' && navigationFirst && firstJump === '#navigate-card')\n          ? {bodyOverflow, researchOverflow, scrollHeight:document.documentElement.scrollHeight, navigationFirst, firstJump}\n          : null;'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one mobile smoke block, found {count}')
          smoke.write_text(text.replace(old, new), encoding='utf-8')
      - working-directory: map
        run: |
          npm ci
          npm run check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-61-patch.yml
          git add map/src/app/app.ts .github/scripts/standalone-journey-browser-smoke.py
          git commit -m "Harden mobile quick navigation"
          git push origin HEAD:issue/61-mobile-quick-navigation
