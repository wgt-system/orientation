name: Apply Current Location Browser Acceptance Patch

on:
  push:
    branches: [issue/59-current-location-origin]
    paths: [.github/workflows/patch-current-location-smoke.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue/59-current-location-origin
      - name: Patch standalone Journey smoke
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/standalone-journey-browser-smoke.py')
          text = path.read_text(encoding='utf-8')
          old = '''def select_origin_and_destination(session: str, metadata: dict) -> None:\n    origin_name = metadata.get("originStopName") or "Aachen"\n    destination_name = metadata.get("destinationStopName") or "Aachen"\n    search_and_select(\n        session,\n        "#route-origin-query",\n        "#route-origin-search",\n        "#route-origin-results",\n        "#route-origin-status",\n        origin_name,\n    )\n    search_and_select(\n        session,\n        "#route-destination-query",\n        "#route-destination-search",\n        "#route-destination-results",\n        "#route-destination-status",\n        destination_name,\n    )\n    selected = text(session, "#selected-destination")\n    if not selected.startswith("Destination:"):\n        raise AssertionError(f"Destination summary is not visible after direct search: {selected}")\n    if execute(session, "return document.querySelectorAll('#candidate-list .candidate-button').length;") != 0:\n        raise AssertionError("Ad-hoc Journey acceptance unexpectedly depends on a Discovery Candidate")\n'''
          new = '''def select_origin_and_destination(session: str, request: dict, metadata: dict) -> None:\n    origin = request["origin"]\n    execute(\n        session,\n        f"""\n        Object.defineProperty(navigator, 'geolocation', {{\n          configurable: true,\n          value: {{\n            getCurrentPosition(success) {{\n              success({{\n                coords: {{\n                  longitude: {origin['longitude']},\n                  latitude: {origin['latitude']},\n                  accuracy: 12.4\n                }},\n                timestamp: Date.now()\n              }});\n            }}\n          }}\n        }});\n        return true;\n        """,\n    )\n    click(session, "#route-use-current-location")\n    wait_for(\n        session,\n        "current-location origin selection",\n        "return document.querySelector('#route-origin-status')?.textContent?.startsWith('Selected: Current location');",\n    )\n    origin_status = text(session, "#route-origin-status")\n    if "±12 m" not in origin_status:\n        raise AssertionError(f"Current-location accuracy was not shown: {origin_status}")\n\n    destination_name = metadata.get("destinationStopName") or "Aachen"\n    search_and_select(\n        session,\n        "#route-destination-query",\n        "#route-destination-search",\n        "#route-destination-results",\n        "#route-destination-status",\n        destination_name,\n    )\n    selected = text(session, "#selected-destination")\n    if not selected.startswith("Destination:"):\n        raise AssertionError(f"Destination summary is not visible after direct search: {selected}")\n    if execute(session, "return document.querySelectorAll('#candidate-list .candidate-button').length;") != 0:\n        raise AssertionError("Quick Journey acceptance unexpectedly depends on a Discovery Candidate")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one select_origin_and_destination block, found {text.count(old)}')
          text = text.replace(old, new)
          old_call = '''        select_origin_and_destination(session, metadata)'''
          new_call = '''        select_origin_and_destination(session, request, metadata)'''
          if text.count(old_call) != 1:
              raise SystemExit('Expected one select_origin_and_destination call')
          text = text.replace(old_call, new_call)
          text = text.replace(
              'real place-to-place public-transit Journey alternative(s) without research import',
              'real current-location-to-place public-transit Journey alternative(s) without research import',
          )
          path.write_text(text, encoding='utf-8')
      - name: Commit patched smoke and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-current-location-smoke.yml
          git add .github/scripts/standalone-journey-browser-smoke.py
          git commit -m "Cover current-location Journey origin in browser acceptance"
          git push origin HEAD:issue/59-current-location-origin
