name: Release Promotion

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  promote:
    if: startsWith(github.event.head_commit.message, 'Release Orientation v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          message="$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH")"
          first_line="${message%%$'\n'*}"
          version="${first_line#Release Orientation }"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release commit title: $first_line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 1
          fi

      - name: Ensure release milestone and assignments
        id: milestone
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          milestone="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"$VERSION\") | .number" | head -n 1)"
          if [[ -z "$milestone" ]]; then
            milestone="$(gh api --method POST "repos/$GITHUB_REPOSITORY/milestones" \
              -f title="$VERSION" \
              -f description="Orientation $VERSION release work packages." \
              --jq '.number')"
          fi
          for issue in 20 21 22 23 24; do
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -F milestone="$milestone" >/dev/null
          done
          echo "number=$milestone" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

          cat > /tmp/release-notes.md <<'EOF'
          Orientation v0.4.0 establishes the first independently useful persistent discovery baseline.

          - Spatial Research Contract 1.0 with explicit criteria, provenance and heuristic/evidence boundaries.
          - Deterministic external-research prompt generation with no paid LLM/API requirement.
          - Strict validate-before-mutation import and local SQLite discovery persistence.
          - Restart/reopen support with deterministic unchanged re-import handling.
          - First standalone Orientation discovery application: question -> prompt -> import -> collection -> map/evidence -> destination -> DRIVING/CYCLING/WALKING route.
          - Existing Reference Host, Embed Host and `orientation.host-bridge` 1.0 remain compatible.
          - Dependency security gate added; Log4j API and Jackson Databind managed versions patched to the fixed releases identified during hardening.
          - Full backend/map CI, dependency scan, real Valhalla routing, Reference Host Chrome smoke and standalone import/restart/reopen/route smoke passed before promotion.

          This release does not claim public transit, realtime transit, shared mobility, multimodal journey planning, turn-by-turn live navigation, automatic background research, paid LLM/API execution, Vocation migration completion, cross-device synchronization or physical-iPhone validation.
          EOF

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Orientation $VERSION" \
            --notes-file /tmp/release-notes.md

      - name: Close release issue and milestone
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ steps.milestone.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue close 24 --repo "$GITHUB_REPOSITORY" --reason completed
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/milestones/$MILESTONE" -f state=closed >/dev/null
