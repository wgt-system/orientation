name: Release Promotion

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  promote:
    if: startsWith(github.event.head_commit.message, 'Release Orientation v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          message="$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH")"
          first_line="${message%%$'\n'*}"
          version="${first_line#Release Orientation }"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release commit title: $first_line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 1
          fi

      - name: Resolve release milestone and release issue
        id: milestone
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          milestone="$(gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | .number" | head -n 1)"
          if [[ -z "$milestone" ]]; then
            echo "Open release milestone $VERSION does not exist."
            exit 1
          fi

          open_issues="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&milestone=$milestone&per_page=100" \
            --jq '.[] | select(has("pull_request") | not) | [.number, .title] | @tsv')"
          issue_count="$(printf '%s\n' "$open_issues" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$issue_count" != "1" ]]; then
            echo "Expected exactly one open release issue in milestone $VERSION, found $issue_count."
            printf '%s\n' "$open_issues"
            exit 1
          fi

          release_issue="$(printf '%s\n' "$open_issues" | cut -f1)"
          release_title="$(printf '%s\n' "$open_issues" | cut -f2-)"
          if [[ "$release_title" != *"$VERSION"* ]]; then
            echo "Open milestone issue #$release_issue does not identify $VERSION: $release_title"
            exit 1
          fi

          echo "number=$milestone" >> "$GITHUB_OUTPUT"
          echo "release_issue=$release_issue" >> "$GITHUB_OUTPUT"

      - name: Create exact tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Orientation $VERSION" \
            --generate-notes

      - name: Close release issue and milestone
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ steps.milestone.outputs.number }}
          RELEASE_ISSUE: ${{ steps.milestone.outputs.release_issue }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue close "$RELEASE_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/milestones/$MILESTONE" -f state=closed >/dev/null
