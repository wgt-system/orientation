# v0.5.x hardening: semantic providers stay local by default; OpenFreeMap remains the intentional external basemap.
spring:
  application:
    name: orientation

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  address: 127.0.0.1
  shutdown: graceful

orientation:
  discovery:
    database-path: ${ORIENTATION_DATABASE_PATH:./data/orientation.db}
  valhalla:
    base-url: ${ORIENTATION_VALHALLA_BASE_URL:http://127.0.0.1:8002}
    connect-timeout: 2s
    read-timeout: 10s
    user-agent: wgt-system-orientation/0.5.0
  motis:
    base-url: ${ORIENTATION_MOTIS_BASE_URL:http://127.0.0.1:8081}
    connect-timeout: 3s
    read-timeout: 15s
    user-agent: wgt-system-orientation/0.5.0 (+https://github.com/wgt-system/orientation)
