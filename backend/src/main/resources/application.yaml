# v0.4.0 release gate: persistent discovery is covered by the real Valhalla/Chrome smoke.
spring:
  application:
    name: orientation

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  shutdown: graceful

orientation:
  discovery:
    database-path: ${ORIENTATION_DATABASE_PATH:./data/orientation.db}
  photon:
    base-url: https://photon.komoot.io
    connect-timeout: 3s
    read-timeout: 5s
    user-agent: wgt-system-orientation/0.2.0
  valhalla:
    base-url: http://localhost:8002
    connect-timeout: 2s
    read-timeout: 10s
    user-agent: wgt-system-orientation/0.3.0
  motis:
    base-url: ${ORIENTATION_MOTIS_BASE_URL:http://localhost:8081}
    connect-timeout: 3s
    read-timeout: 15s
    user-agent: wgt-system-orientation/0.5.0 (+https://github.com/wgt-system/orientation)
